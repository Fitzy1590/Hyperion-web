name: build

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore src/Hyperion.sln
      - run: dotnet build src/Hyperion.sln -c Release --no-restore
      - run: dotnet test src/Hyperion.Tests/Hyperion.Tests.csproj -c Release --no-build --logger "trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*.trx"
